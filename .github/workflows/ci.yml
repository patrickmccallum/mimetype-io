name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Lint, validate data, build and check pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
